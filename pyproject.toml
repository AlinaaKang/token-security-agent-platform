[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "token-security-agent-platform"
version = "0.1.0"
description = "Token-level anomaly detection agent platform for LLM jailbreak defense"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.116,<0.117",
  "pydantic>=2.11,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
]
model = [
  "accelerate>=1.2,<2",
  "torch>=2.5,<3",
  "transformers>=4.51,<5",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "gpu: requires a configured CUDA model runtime",
]
